  .hw-seam { fill: none; stroke: #59636e; stroke-width: 2; }
  .hw-edge.t-out { stroke: #bc4c00; stroke-width: 3; }
  .hw-head { fill: #59636e; }
  .hw-head.t-out { fill: #bc4c00; }
  .hw-elabel { fill: #59636e; paint-order: stroke; stroke: #ffffff; stroke-width: 5px; stroke-linejoin: round; }
  .hw-elabel.t-out { fill: #953800; font-weight: 700; }
    </style>
  </defs>
  <rect class="hw-bg" width="1240" height="512"/>
  <rect class="hw-lane t-plain" x="16" y="16" width="290" height="480" rx="8" data-id="lane-dev"/>
  <text class="hw-lane-name t-plain" x="30" y="40" font-size="15" font-weight="700" data-in="lane-dev">개발자 쪽</text>
  <text class="hw-sub" x="30" y="59" font-size="12" data-in="lane-dev">모델 없이 돎 · 바깥 통신 없음</text>
  <rect class="hw-lane t-plain" x="326" y="16" width="300" height="480" rx="8" data-id="lane-shared"/>
  <text class="hw-lane-name t-plain" x="340" y="40" font-size="15" font-weight="700" data-in="lane-shared">함께 쓰는 것</text>
  <text class="hw-sub" x="340" y="59" font-size="12" data-in="lane-shared">파일 고르기 · 인용 관문 · 비밀값 가림도</text>
  <rect class="hw-lane t-plain" x="646" y="16" width="270" height="480" rx="8" data-id="lane-web"/>
  <text class="hw-lane-name t-plain" x="660" y="40" font-size="15" font-weight="700" data-in="lane-web">웹 쪽</text>
  <text class="hw-sub" x="660" y="59" font-size="12" data-in="lane-web">실행기가 부름 · AI 중심</text>
  <rect class="hw-box t-plain" x="30" y="80" width="262" height="112" rx="8" data-id="scan"/>
  <text class="hw-title" x="44" y="107" font-size="17" font-weight="700" data-in="scan">scan</text>
  <text class="hw-line" x="44" y="132" font-size="14" data-in="scan">kr-core → Semgrep CE 로 한꺼번에</text>
  <text class="hw-line" x="44" y="153" font-size="14" data-in="scan">참·거짓·모름 세 값으로</text>
  <text class="hw-line" x="44" y="174" font-size="14" data-in="scan">--staged · --diff</text>
  <rect class="hw-box t-plain" x="30" y="208" width="262" height="91" rx="8" data-id="hook"/>
  <text class="hw-title" x="44" y="235" font-size="17" font-weight="700" data-in="hook">Claude Code 훅</text>
  <text class="hw-line" x="44" y="260" font-size="14" data-in="hook">Edit·Write 뒤 그 파일 하나</text>
  <text class="hw-line" x="44" y="281" font-size="14" data-in="hook">확실한 '검토 필요'만 알림</text>
  <rect class="hw-box t-plain" x="30" y="315" width="262" height="133" rx="8" data-id="ci"/>
  <text class="hw-title" x="44" y="342" font-size="17" font-weight="700" data-in="ci">pre-commit · CI</text>
  <text class="hw-line" x="44" y="367" font-size="14" data-in="ci">pre-commit: 커밋할 JS/TS 파일</text>
  <text class="hw-line" x="44" y="388" font-size="14" data-in="ci">CI: 저장소 전체</text>
  <text class="hw-line" x="44" y="409" font-size="14" data-in="ci">SARIF 2.1.0 · GitLab Code Quality</text>
  <text class="hw-line" x="44" y="430" font-size="14" data-in="ci">종료 코드 0·1·2</text>
  <rect class="hw-box t-plain" x="340" y="80" width="272" height="112" rx="8" data-id="pack"/>
  <text class="hw-title" x="354" y="107" font-size="17" font-weight="700" data-in="pack">정책 팩 kr-core</text>
  <text class="hw-line" x="354" y="132" font-size="14" data-in="pack">정책 6 · 의무 8 · 조문 원문 8</text>
  <text class="hw-line" x="354" y="153" font-size="14" data-in="pack">Semgrep 규칙으로 옮겨 씀</text>
  <text class="hw-line" x="354" y="174" font-size="14" data-in="pack">두 쪽이 함께 씀</text>
  <rect class="hw-box t-plain" x="340" y="208" width="272" height="112" rx="8" data-id="map"/>
  <text class="hw-title" x="354" y="235" font-size="17" font-weight="700" data-in="map">의무 지도 795</text>
  <text class="hw-line" x="354" y="260" font-size="14" data-in="map">법령 이름 113종 · 기능 26가지</text>
  <text class="hw-line" x="354" y="281" font-size="14" data-in="map">profile · review 만 읽음 (웹 쪽)</text>
  <text class="hw-line" x="354" y="302" font-size="14" data-in="map">kr-core 는 그 가운데 8개</text>
  <rect class="hw-box t-plain" x="340" y="336" width="272" height="112" rx="8" data-id="contract"/>
  <text class="hw-title" x="354" y="363" font-size="17" font-weight="700" data-in="contract">출력 계약</text>
  <text class="hw-line" x="354" y="388" font-size="14" data-in="contract">scan: report-1 JSON 스키마</text>
  <text class="hw-line" x="354" y="409" font-size="14" data-in="contract">review: review-2 JSON 스키마</text>
  <text class="hw-line" x="354" y="430" font-size="14" data-in="contract">profile: 판 1 (스키마 파일 없음)</text>
  <rect class="hw-box t-model" x="660" y="80" width="242" height="91" rx="8" stroke-dasharray="7 5" data-id="judge"/>
  <text class="hw-title" x="674" y="107" font-size="17" font-weight="700" data-in="judge">scan --judge haiku</text>
  <text class="hw-tag t-model" x="892" y="98" font-size="12" font-weight="700" text-anchor="end" data-in="judge">모델</text>
  <text class="hw-line" x="674" y="132" font-size="14" data-in="judge">정적으로 결론이 안 난 곳만</text>
  <text class="hw-line" x="674" y="153" font-size="14" data-in="judge">파일 하나씩 물음</text>
  <rect class="hw-box t-plain" x="660" y="187" width="242" height="91" rx="8" data-id="prof"/>
  <text class="hw-title" x="674" y="214" font-size="17" font-weight="700" data-in="prof">profile</text>
  <text class="hw-line" x="674" y="239" font-size="14" data-in="prof">모델 없음</text>
  <text class="hw-line" x="674" y="260" font-size="14" data-in="prof">기능 · 플랫폼 · 의무 목록</text>
  <rect class="hw-box t-model" x="660" y="294" width="242" height="112" rx="8" stroke-dasharray="7 5" data-id="rev"/>
  <text class="hw-title" x="674" y="321" font-size="17" font-weight="700" data-in="rev">review</text>
  <text class="hw-tag t-model" x="892" y="312" font-size="12" font-weight="700" text-anchor="end" data-in="rev">모델</text>
  <text class="hw-line" x="674" y="346" font-size="14" data-in="rev">haiku 조사 + sonnet 반박</text>
  <text class="hw-line" x="674" y="367" font-size="14" data-in="rev">켰을 때만 (하루 10건)</text>
  <text class="hw-line" x="674" y="388" font-size="14" data-in="rev">한 건 상한 어림 $3·420초</text>
  <text class="hw-tag t-out" x="30" y="478" font-size="12" font-weight="700" data-in="lane-dev">--judge 를 켜면 판정 대상 코드가 외부 API 로 나감</text>
  <text class="hw-tag t-out" x="660" y="478" font-size="12" font-weight="700" data-in="lane-web">판정 대상 코드가 Anthropic API 로 나감</text>
  <path class="hw-seam" d="M956 42 L956 496" stroke-dasharray="7 5"/>
  <text class="hw-lane-name" x="956" y="30" font-size="15" font-weight="700" text-anchor="middle">이음매</text>
  <rect class="hw-box t-keep" x="996" y="169" width="228" height="175" rx="8" data-id="site"/>
  <text class="hw-title" x="1010" y="196" font-size="17" font-weight="700" data-in="site">웹 (이 사이트)</text>
  <text class="hw-line" x="1010" y="221" font-size="14" data-in="site">CLI 커밋 b5888e5 고정</text>
  <text class="hw-line" x="1010" y="242" font-size="14" data-in="site">(태그 handoff-w11-8)</text>
  <text class="hw-line" x="1010" y="263" font-size="14" data-in="site">결과 JSON 의 스키마</text>
  <text class="hw-line" x="1010" y="284" font-size="14" data-in="site">(review-2 사본 · scan 판 1)</text>
  <text class="hw-line" x="1010" y="305" font-size="14" data-in="site">팩 메타데이터 (조문 원문)</text>
  <text class="hw-line" x="1010" y="326" font-size="14" data-in="site">계약 시험: 커밋·날짜·팩</text>
  <path class="hw-edge t-plain" d="M916 256.5 L996 256.5" marker-end="url(#how-uses-head)"/>
  <text class="hw-elabel t-plain" x="956" y="244.5" font-size="14" text-anchor="middle">결과 JSON</text>
