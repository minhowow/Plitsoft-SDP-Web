<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="512" viewBox="0 0 1240 512" font-family="-apple-system, BlinkMacSystemFont, 'Apple SD Gothic Neo', 'Malgun Gothic', 'Noto Sans KR', 'Noto Sans CJK KR', sans-serif">
  <title>같은 엔진, 두 가지 쓰임</title>
  <defs>
    <marker id="how-uses-head" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" class="hw-head t-plain"/></marker>
    <marker id="how-uses-head-out" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="13" markerHeight="13" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" class="hw-head t-out"/></marker>
    <style>
  .hw-bg { fill: #ffffff; }
  .hw-lane { fill: #f6f8fa; stroke: #d1d9e0; stroke-width: 1.5; }
