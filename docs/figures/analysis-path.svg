<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="790" viewBox="0 0 1280 790" font-family="-apple-system, BlinkMacSystemFont, 'Apple SD Gothic Neo', 'Malgun Gothic', 'Noto Sans KR', 'Noto Sans CJK KR', sans-serif">
  <title>한 번의 분석이 지나는 길</title>
  <defs>
    <marker id="how-path-head" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" class="hw-head t-plain"/></marker>
    <marker id="how-path-head-out" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="13" markerHeight="13" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" class="hw-head t-out"/></marker>
    <style>
  .hw-bg { fill: #ffffff; }
  .hw-lane { fill: #f6f8fa; stroke: #d1d9e0; stroke-width: 1.5; }
  .hw-lane.t-out { fill: #fff1e5; stroke: #bc4c00; }
  .hw-lane.t-keep { fill: #ffffff; stroke: #818b98; }
  .hw-lane-name { fill: #1f2328; }
  .hw-lane-name.t-out { fill: #953800; }
  .hw-sub { fill: #59636e; }
  .hw-box { fill: #ffffff; stroke: #818b98; stroke-width: 1.5; }
  .hw-box.t-out { fill: #fff1e5; stroke: #bc4c00; stroke-width: 2; }
  .hw-box.t-model { fill: #fbefff; stroke: #8250df; stroke-width: 2; }
  .hw-box.t-tool { fill: #ddf4ff; stroke: #0969da; stroke-width: 2; }
  .hw-box.t-keep { fill: #ffffff; stroke: #1f2328; stroke-width: 2; }
  .hw-title { fill: #1f2328; }
  .hw-line { fill: #59636e; }
  .hw-tag { fill: #59636e; }
  .hw-tag.t-out { fill: #953800; }
  .hw-tag.t-model { fill: #8250df; }
  .hw-tag.t-tool { fill: #0969da; }
  .hw-edge { fill: none; stroke: #59636e; stroke-width: 2; }
  .hw-seam { fill: none; stroke: #59636e; stroke-width: 2; }
  .hw-edge.t-out { stroke: #bc4c00; stroke-width: 3; }
  .hw-head { fill: #59636e; }
  .hw-head.t-out { fill: #bc4c00; }
  .hw-elabel { fill: #59636e; paint-order: stroke; stroke: #ffffff; stroke-width: 5px; stroke-linejoin: round; }
  .hw-elabel.t-out { fill: #953800; font-weight: 700; }
    </style>
  </defs>
  <rect class="hw-bg" width="1280" height="790"/>
  <rect class="hw-lane t-plain" x="16" y="16" width="1248" height="112" rx="8" data-id="lane-browser"/>
  <text class="hw-lane-name t-plain" x="30" y="40" font-size="15" font-weight="700" data-in="lane-browser">브라우저</text>
  <rect class="hw-lane t-plain" x="16" y="136" width="1248" height="178" rx="8" data-id="lane-vercel"/>
  <text class="hw-lane-name t-plain" x="30" y="160" font-size="15" font-weight="700" data-in="lane-vercel">Vercel</text>
  <text class="hw-sub" x="30" y="179" font-size="12" data-in="lane-vercel">서버 함수 · sin1</text>
  <rect class="hw-lane t-plain" x="16" y="322" width="1248" height="128" rx="8" data-id="lane-db"/>
  <text class="hw-lane-name t-plain" x="30" y="346" font-size="15" font-weight="700" data-in="lane-db">DB</text>
  <text class="hw-sub" x="30" y="365" font-size="12" data-in="lane-db">Postgres · Neon</text>
  <rect class="hw-lane t-keep" x="16" y="458" width="1248" height="180" rx="8" data-id="lane-vm"/>
  <text class="hw-lane-name t-keep" x="30" y="482" font-size="15" font-weight="700" data-in="lane-vm">GitHub Actions VM</text>
  <text class="hw-sub" x="30" y="501" font-size="12" data-in="lane-vm">분석마다 새 VM</text>
  <rect class="hw-lane t-out" x="16" y="646" width="1248" height="128" rx="8" data-id="lane-ai"/>
  <text class="hw-lane-name t-out" x="30" y="670" font-size="15" font-weight="700" data-in="lane-ai">Anthropic API</text>
  <rect class="hw-box t-plain" x="196" y="37" width="250" height="70" rx="8" data-id="ask"/>
  <text class="hw-title" x="210" y="64" font-size="17" font-weight="700" data-in="ask">분석 요청</text>
  <text class="hw-line" x="210" y="89" font-size="14" data-in="ask">저장소 쪽의 단추</text>
  <rect class="hw-box t-plain" x="196" y="148" width="250" height="154" rx="8" data-id="web"/>
  <text class="hw-title" x="210" y="175" font-size="17" font-weight="700" data-in="web">웹 (Next.js)</text>
  <text class="hw-line" x="210" y="200" font-size="14" data-in="web">GitHub 에 공개·끝 커밋 확인</text>
  <text class="hw-line" x="210" y="221" font-size="14" data-in="web">새 분석 하루 30건</text>
  <text class="hw-line" x="210" y="242" font-size="14" data-in="web">review 하루 10건</text>
  <text class="hw-line" x="210" y="263" font-size="14" data-in="web">같은 커밋은 다시 씀</text>
  <text class="hw-line" x="210" y="284" font-size="14" data-in="web">(분석은 60분 · review 는 늘)</text>
  <rect class="hw-box t-plain" x="196" y="341" width="250" height="91" rx="8" data-id="queue"/>
  <text class="hw-title" x="210" y="368" font-size="17" font-weight="700" data-in="queue">대기열</text>
  <text class="hw-line" x="210" y="393" font-size="14" data-in="queue">분석 줄 (analyses 표)</text>
  <text class="hw-line" x="210" y="414" font-size="14" data-in="queue">실행 자리 2 · 대기 20</text>
  <rect class="hw-box t-plain" x="498" y="470" width="518" height="157" rx="8" data-id="runner"/>
  <text class="hw-title" x="512" y="497" font-size="17" font-weight="700" data-in="runner">실행기</text>
  <text class="hw-line" x="512" y="522" font-size="14" data-in="runner">입력 확인</text>
  <text class="hw-line" x="512" y="543" font-size="14" data-in="runner">GitHub 에서 압축본 받기</text>
  <text class="hw-line" x="512" y="564" font-size="14" data-in="runner">CLI 설치 (고정 커밋)</text>
  <text class="hw-line" x="512" y="585" font-size="14" data-in="runner">진행·결과를 서명해 보냄</text>
  <rect class="hw-box t-plain" x="760" y="482" width="244" height="133" rx="8" data-id="cli"/>
  <text class="hw-title" x="774" y="509" font-size="17" font-weight="700" data-in="cli">CLI b5888e5</text>
  <text class="hw-tag t-plain" x="994" y="500" font-size="12" font-weight="700" text-anchor="end" data-in="cli">handoff-w11-8</text>
  <text class="hw-line" x="774" y="534" font-size="14" data-in="cli">scan · AI 판정 (haiku)</text>
  <text class="hw-line" x="774" y="555" font-size="14" data-in="cli">profile 명령 (모델 없음)</text>
  <text class="hw-line" x="774" y="576" font-size="14" data-in="cli">review (haiku·sonnet)</text>
  <text class="hw-line" x="774" y="597" font-size="14" data-in="cli">review 한 건 어림 $3·420초</text>
  <rect class="hw-box t-plain" x="1066" y="180" width="190" height="91" rx="8" data-id="recv"/>
  <text class="hw-title" x="1080" y="207" font-size="17" font-weight="700" data-in="recv">결과 받기·보이기</text>
  <text class="hw-line" x="1080" y="232" font-size="14" data-in="recv">콜백 서명 확인 (HMAC)</text>
  <text class="hw-line" x="1080" y="253" font-size="14" data-in="recv">DB 에서 읽어 쪽을 그림</text>
  <rect class="hw-box t-keep" x="1066" y="330" width="190" height="112" rx="8" data-id="store"/>
  <text class="hw-title" x="1080" y="357" font-size="17" font-weight="700" data-in="store">결과 저장</text>
  <text class="hw-line" x="1080" y="382" font-size="14" data-in="store">결과 JSON 셋</text>
  <text class="hw-line" x="1080" y="403" font-size="14" data-in="store">(인용한 코드 줄 포함)</text>
  <text class="hw-line" x="1080" y="424" font-size="14" data-in="store">코드 전체는 두지 않음</text>
  <rect class="hw-box t-plain" x="1066" y="37" width="190" height="70" rx="8" data-id="screen"/>
  <text class="hw-title" x="1080" y="64" font-size="17" font-weight="700" data-in="screen">화면</text>
  <text class="hw-line" x="1080" y="89" font-size="14" data-in="screen">3초마다 진행 읽기</text>
  <rect class="hw-box t-out" x="760" y="690" width="244" height="70" rx="8" data-id="ai"/>
  <text class="hw-title" x="774" y="717" font-size="17" font-weight="700" data-in="ai">AI</text>
  <text class="hw-tag t-out" x="994" y="708" font-size="12" font-weight="700" text-anchor="end" data-in="ai">외부</text>
  <text class="hw-line" x="774" y="742" font-size="14" data-in="ai">haiku 5.5 · sonnet 5.5</text>
  <path class="hw-edge t-plain" d="M252 107 L252 148" marker-end="url(#how-path-head)"/>
  <text class="hw-elabel t-plain" x="264" y="132.5" font-size="14">저장소 주소</text>
  <path class="hw-edge t-plain" d="M252 302 L252 341" marker-end="url(#how-path-head)"/>
  <text class="hw-elabel t-plain" x="264" y="326.5" font-size="14">분석 줄</text>
  <path class="hw-edge t-plain" d="M446 225 L558 225 L558 470" marker-end="url(#how-path-head)"/>
  <text class="hw-elabel t-plain" x="570" y="374" font-size="14">깨움: 분석 id·커밋</text>
  <text class="hw-elabel t-plain" x="570" y="396" font-size="14">(GitHub API)</text>
  <path class="hw-edge t-out" d="M830 615 L830 690" marker-end="url(#how-path-head-out)"/>
  <text class="hw-elabel t-out" x="818" y="676" font-size="14" text-anchor="end">코드·질문</text>
  <path class="hw-edge t-plain" d="M940 690 L940 615" marker-end="url(#how-path-head)"/>
  <text class="hw-elabel t-plain" x="952" y="676" font-size="14">답</text>
  <path class="hw-edge t-plain" d="M1016 548.5 L1042 548.5 L1042 225.5 L1066 225.5" marker-end="url(#how-path-head)"/>
  <text class="hw-elabel t-plain" x="1030" y="374" font-size="14" text-anchor="end">진행·결과 JSON</text>
  <text class="hw-elabel t-plain" x="1030" y="396" font-size="14" text-anchor="end">(서명한 콜백)</text>
  <path class="hw-edge t-plain" d="M1161 271 L1161 330" marker-end="url(#how-path-head)"/>
  <text class="hw-elabel t-plain" x="1173" y="305.5" font-size="14">저장</text>
  <path class="hw-edge t-plain" d="M1161 180 L1161 107" marker-end="url(#how-path-head)"/>
  <text class="hw-elabel t-plain" x="1149" y="148.5" font-size="14" text-anchor="end">진행·결과 (3초마다 읽음)</text>
  <text class="hw-title" x="196" y="524" font-size="14" font-weight="700">남의 코드는 이 VM 에만 풀림</text>
  <text class="hw-line" x="196" y="545" font-size="14">읽기만 (설치·빌드·실행 없음)</text>
  <text class="hw-line" x="196" y="566" font-size="14">작업이 끝나면 VM 째 사라짐</text>
  <path class="hw-edge t-out" d="M196 719 L240 719" marker-end="url(#how-path-head-out)"/>
  <text class="hw-tag t-out" x="252" y="724" font-size="14" font-weight="700">바깥으로 나감 (비밀값 모양은 가림)</text>
</svg>
