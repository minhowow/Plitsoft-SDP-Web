<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="722" viewBox="0 0 1240 722" font-family="-apple-system, BlinkMacSystemFont, 'Apple SD Gothic Neo', 'Malgun Gothic', 'Noto Sans KR', 'Noto Sans CJK KR', sans-serif">
  <title>따라가 보기: 한 저장소의 한 줄</title>
