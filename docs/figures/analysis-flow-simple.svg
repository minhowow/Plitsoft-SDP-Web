<svg xmlns="http://www.w3.org/2000/svg" width="1456" height="245" viewBox="0 0 1456 245" font-family="-apple-system, BlinkMacSystemFont, 'Apple SD Gothic Neo', 'Malgun Gothic', 'Noto Sans KR', 'Noto Sans CJK KR', sans-serif">
  <title>검토 엔진 안에서 일어나는 일</title>
  <defs>
    <marker id="how-review-simple-head" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" class="hw-head t-plain"/></marker>
    <marker id="how-review-simple-head-out" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="13" markerHeight="13" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" class="hw-head t-out"/></marker>
    <style>
  .hw-bg { fill: #ffffff; }
  .hw-lane { fill: #f6f8fa; stroke: #d1d9e0; stroke-width: 1.5; }
  .hw-lane.t-out { fill: #fff1e5; stroke: #bc4c00; }
  .hw-lane.t-keep { fill: #ffffff; stroke: #818b98; }
  .hw-lane-name { fill: #1f2328; }
  .hw-lane-name.t-out { fill: #953800; }
  .hw-sub { fill: #59636e; }
  .hw-box { fill: #ffffff; stroke: #818b98; stroke-width: 1.5; }
  .hw-box.t-out { fill: #fff1e5; stroke: #bc4c00; stroke-width: 2; }
  .hw-box.t-model { fill: #fbefff; stroke: #8250df; stroke-width: 2; }
  .hw-box.t-tool { fill: #ddf4ff; stroke: #0969da; stroke-width: 2; }
  .hw-box.t-keep { fill: #ffffff; stroke: #1f2328; stroke-width: 2; }
  .hw-title { fill: #1f2328; }
  .hw-line { fill: #59636e; }
  .hw-tag { fill: #59636e; }
  .hw-tag.t-out { fill: #953800; }
  .hw-tag.t-model { fill: #8250df; }
  .hw-tag.t-tool { fill: #0969da; }
  .hw-edge { fill: none; stroke: #59636e; stroke-width: 2; }
  .hw-seam { fill: none; stroke: #59636e; stroke-width: 2; }
  .hw-edge.t-out { stroke: #bc4c00; stroke-width: 3; }
