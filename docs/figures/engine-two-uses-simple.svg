  </defs>
  <rect class="hw-bg" width="1240" height="170"/>
  <rect class="hw-box t-plain" x="16" y="16" width="372" height="106" rx="8" data-id="dev"/>
  <text class="hw-title" x="30" y="47" font-size="21" font-weight="700" data-in="dev">개발할 때</text>
  <text class="hw-line" x="30" y="74" font-size="16" data-in="dev">내 컴퓨터와 CI 에서, AI 없이도 돎</text>
  <text class="hw-small" x="30" y="108" font-size="13" data-in="dev">scan · Claude Code 훅 · pre-commit · CI</text>
  <text class="hw-tag t-out" x="30" y="150" font-size="15" font-weight="700">AI 를 켜면 코드가 바깥으로 나감</text>
  <rect class="hw-box t-keep" x="434" y="16" width="372" height="106" rx="8" data-id="engine"/>
  <text class="hw-title" x="448" y="47" font-size="21" font-weight="700" data-in="engine">같은 엔진 · 같은 정책</text>
  <text class="hw-line" x="448" y="74" font-size="16" data-in="engine">같은 규칙으로 코드를 검사</text>
  <text class="hw-small" x="448" y="108" font-size="13" data-in="engine">policypack</text>
  <rect class="hw-box t-plain" x="852" y="16" width="372" height="106" rx="8" data-id="web"/>
  <text class="hw-title" x="866" y="47" font-size="21" font-weight="700" data-in="web">웹에서</text>
