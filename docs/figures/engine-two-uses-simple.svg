<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="170" viewBox="0 0 1240 170" font-family="-apple-system, BlinkMacSystemFont, 'Apple SD Gothic Neo', 'Malgun Gothic', 'Noto Sans KR', 'Noto Sans CJK KR', sans-serif">
  <title>같은 엔진, 두 가지 쓰임</title>
  <defs>
