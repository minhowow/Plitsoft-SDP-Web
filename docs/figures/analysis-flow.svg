<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="330" viewBox="0 0 1920 330" font-family="'Apple SD Gothic Neo', 'Malgun Gothic', 'Noto Sans KR', sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#59636e"/>
    </marker>
    <style>
      .box { fill: #ffffff; stroke: #d1d9e0; stroke-width: 2; }
      .run { fill: #f6f8fa; stroke: #0969da; stroke-width: 2.5; }
      .num { fill: #0969da; }
      .numtext { fill: #ffffff; font-size: 20px; font-weight: 700; }
      .title { fill: #1f2328; font-size: 30px; font-weight: 700; }
      .line { fill: #59636e; font-size: 19px; }
      .mono { fill: #59636e; font-size: 17px; font-family: 'SF Mono', Menlo, Consolas, monospace; }
      .edge { stroke: #59636e; stroke-width: 2.5; fill: none; }
    </style>
  </defs>
  <rect width="1920" height="330" fill="#ffffff"/>

  <!-- 1. 저장소 -->
  <rect class="box" x="44" y="40" width="272" height="250" rx="12"/>
  <circle class="num" cx="78" cy="76" r="17"/><text class="numtext" x="78" y="83" text-anchor="middle">1</text>
  <text class="title" x="106" y="87">저장소</text>
  <text class="line" x="68" y="140">GitHub 공개 저장소</text>
  <text class="line" x="68" y="168">고정한 커밋</text>
  <text class="mono" x="68" y="240">읽기만</text>

  <!-- 2. 프로필 -->
  <rect class="box" x="356" y="40" width="272" height="250" rx="12"/>
  <circle class="num" cx="390" cy="76" r="17"/><text class="numtext" x="390" y="83" text-anchor="middle">2</text>
  <text class="title" x="418" y="87">프로필</text>
  <text class="line" x="380" y="140">이 저장소가 하는 일</text>
  <text class="line" x="380" y="168">회원 가입·결제·</text>
  <text class="line" x="380" y="196">생성형 AI 호출·광고 발송 …</text>
  <text class="line" x="380" y="224">기능마다 근거 파일</text>

  <!-- 3. 걸리는 의무 -->
  <rect class="box" x="668" y="40" width="272" height="250" rx="12"/>
  <circle class="num" cx="702" cy="76" r="17"/><text class="numtext" x="702" y="83" text-anchor="middle">3</text>
  <text class="title" x="730" y="87">걸리는 의무</text>
  <text class="line" x="692" y="140">기능마다 걸릴 수 있는</text>
  <text class="line" x="692" y="168">법·조문</text>
  <text class="line" x="692" y="196">판단은 하지 않음</text>

  <!-- 4. 의무별 근거 찾기 -->
  <rect class="box" x="980" y="40" width="272" height="250" rx="12"/>
  <circle class="num" cx="1014" cy="76" r="17"/><text class="numtext" x="1014" y="83" text-anchor="middle">4</text>
  <text class="title" x="1042" y="87">의무별 근거 찾기</text>
  <text class="line" x="1004" y="140">정적 검사</text>
  <text class="line" x="1004" y="168">AI 가 여러 파일을 읽음</text>

  <!-- 5. 검증 -->
  <rect class="box" x="1292" y="40" width="272" height="250" rx="12"/>
  <circle class="num" cx="1326" cy="76" r="17"/><text class="numtext" x="1326" y="83" text-anchor="middle">5</text>
  <text class="title" x="1354" y="87">검증</text>
  <text class="line" x="1316" y="140">다른 모델의 반박</text>
  <text class="line" x="1316" y="168">인용 검사</text>
  <text class="line" x="1316" y="196">(인용한 줄이 코드에 있는지)</text>

  <!-- 6. 체크리스트 -->
  <rect class="run" x="1604" y="40" width="272" height="250" rx="12"/>
  <circle class="num" cx="1638" cy="76" r="17"/><text class="numtext" x="1638" y="83" text-anchor="middle">6</text>
  <text class="title" x="1666" y="87">체크리스트</text>
  <text class="line" x="1628" y="140">지킨 근거 있음</text>
  <text class="line" x="1628" y="168">확인할 것</text>
  <text class="line" x="1628" y="196">코드로는 알 수 없음</text>

  <!-- 흐름 -->
  <path class="edge" d="M316 165 L352 165" marker-end="url(#arrow)"/>
  <path class="edge" d="M628 165 L664 165" marker-end="url(#arrow)"/>
  <path class="edge" d="M940 165 L976 165" marker-end="url(#arrow)"/>
  <path class="edge" d="M1252 165 L1288 165" marker-end="url(#arrow)"/>
  <path class="edge" d="M1564 165 L1600 165" marker-end="url(#arrow)"/>

</svg>
